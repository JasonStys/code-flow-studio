name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m pip_audit --local --progress-spinner off
      - run: python -m ruff check studio training runner scripts examples tests
      - run: python scripts/code_index.py --check
      - run: python -m pytest --cov=studio --cov=training.dataset --cov-fail-under=80 --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/tests.xml
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run test:browser
      - run: npm run test:private
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && vars.CODE_FLOW_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: controller-browser-evidence
          path: |
            artifacts/
            test-results/
  isolated-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: docker build -t code-flow-worker:0.2.0 runner
      - run: python -m scripts.worker_checks
      - run: python -m scripts.private_worker_checks
      - run: python -m scripts.push_analysis
        env:
          STUDIO_AI_CONFIG: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CODE_FLOW_ENABLE_AI == 'true' && secrets.STUDIO_AI_CONFIG || '' }}
          STUDIO_OPENAI_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CODE_FLOW_ENABLE_AI == 'true' && secrets.STUDIO_OPENAI_KEY || '' }}
          STUDIO_ANTHROPIC_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CODE_FLOW_ENABLE_AI == 'true' && secrets.STUDIO_ANTHROPIC_KEY || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && vars.CODE_FLOW_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: isolated-worker-evidence
          path: artifacts/
  training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[training]'
      - run: python -m training.train --config examples/training.json --data examples/training.jsonl --output artifacts/model
      - run: python -m scripts.training_checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && vars.CODE_FLOW_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: training-smoke-evidence
          path: |
            artifacts/model/training-report.json
            artifacts/model/api-smoke.json

