name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m pip_audit --local --progress-spinner off
      - run: python -m ruff check studio training runner scripts examples tests
      - run: python scripts/code_index.py --check
      - run: python -m pytest --cov=studio --cov=training.dataset --cov-fail-under=80 --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/tests.xml
      - run: npm ci
      - run: npm run test:electron-readiness
      - run: npm run test:worker-reports
      - run: npm audit --audit-level=high
      - name: Audit and exercise the separately locked worker analyzers
        run: |
          npm ci --prefix runner/tools --ignore-scripts
          npm audit --prefix runner/tools --omit=dev --audit-level=moderate
          node scripts/worker_analyzer_checks.cjs
      - run: npm run build
      - name: Bound official Ubuntu mirror access on the disposable runner
        timeout-minutes: 1
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$(uname -m)" = "x86_64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test -f /etc/apt/apt-mirrors.txt
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          grep -Eq '^URIs:[[:space:]]+mirror[+]file:/etc/apt/apt-mirrors[.]txt[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^Signed-By:[[:space:]]+/usr/share/keyrings/ubuntu-archive-keyring[.]gpg[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          # Preserve source suites, components and signature checks; avoid the stalled HTTP Azure mirror.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          # APT reads this leaf after the runner defaults; these are acquire, not APT::Acquire, keys.
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zzzz-portfolio-network >/dev/null
          apt_network_config="$(apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout)"
          printf '%s\n' "$apt_network_config"
          grep -Fx 'Acquire::Retries "1";' <<< "$apt_network_config"
          grep -Fx 'Acquire::http::Timeout "15";' <<< "$apt_network_config"
          grep -Fx 'Acquire::https::Timeout "15";' <<< "$apt_network_config"
      - name: Install bounded browser OS dependencies
        timeout-minutes: 10
        run: npx --no-install playwright install-deps chromium firefox webkit
      - name: Install exact locked browser engines
        timeout-minutes: 5
        run: npx --no-install playwright install chromium firefox webkit
      - run: npm run test:browser
        env:
          # Retain native renderer exit evidence in job logs even when optional artifacts are off.
          DEBUG: pw:browser
      - run: npm run test:private
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && vars.CODE_FLOW_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: controller-browser-evidence
          path: |
            artifacts/
            test-results/
  isolated-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: docker build -t code-flow-worker:0.4.2 runner
      - run: python -m scripts.worker_checks
      - run: python -m scripts.private_worker_checks
      - run: python -m scripts.push_analysis
        env:
          STUDIO_AI_CONFIG: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CODE_FLOW_ENABLE_AI == 'true' && secrets.STUDIO_AI_CONFIG || '' }}
          STUDIO_OPENAI_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CODE_FLOW_ENABLE_AI == 'true' && secrets.STUDIO_OPENAI_KEY || '' }}
          STUDIO_ANTHROPIC_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CODE_FLOW_ENABLE_AI == 'true' && secrets.STUDIO_ANTHROPIC_KEY || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && vars.CODE_FLOW_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: isolated-worker-evidence
          path: artifacts/
  training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[training]'
      - run: python -m training.train --config examples/training.json --data examples/training.jsonl --output artifacts/model
      - run: python -m scripts.training_checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && vars.CODE_FLOW_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: training-smoke-evidence
          path: |
            artifacts/model/training-report.json
            artifacts/model/api-smoke.json

