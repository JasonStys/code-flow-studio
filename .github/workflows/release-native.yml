name: Release private-account applications
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact validated current-main 40-character source SHA
        required: true
permissions:
  contents: read
concurrency:
  group: code-flow-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      security-events: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      tag: ${{ steps.gate.outputs.tag }}
      release_id: ${{ steps.gate.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "JasonStys/code-flow-studio"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test "$(gh api repos/JasonStys/code-flow-studio/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"
          python -m scripts.release_gate prepare
  build:
    if: github.ref == 'refs/heads/main'
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EXPECTED_SOURCE: ${{ needs.prepare.outputs.sha }}
      EXPECTED_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pip check
      - run: npm ci
      - name: Install and verify pinned Electron before packaging and native tests
        timeout-minutes: 5
        run: npm run setup:electron
      - run: npm run test:electron-readiness
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: python scripts/license_bundle.py
      - run: python -m PyInstaller --noconfirm --onefile --name code-flow-service --distpath release/service --paths . --add-data "dist/ui:ui" scripts/frozen_entry.py
      - run: python -m scripts.release_gate metadata
      - run: npm run package -- --publish never
      - name: Verify actual packaged app and create checksummed archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            export STUDIO_INSTALLED_APP="$PWD/release/installers/win-unpacked/Code Flow Studio.exe"
          elif [ "$RUNNER_OS" = macOS ]; then
            export STUDIO_INSTALLED_APP="$PWD/release/installers/mac-arm64/Code Flow Studio.app/Contents/MacOS/Code Flow Studio"
          else
            export STUDIO_INSTALLED_APP="$PWD/release/installers/linux-unpacked/code-flow-studio"
          fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:desktop; else npm run test:desktop; fi
          python scripts/release_archive.py
      - name: Upload only accepted bytes to the prepared numeric draft ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release_gate upload
  verify-draft:
    if: github.ref == 'refs/heads/main'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub exposes draft metadata only to push-capable credentials.
      # https://docs.github.com/en/rest/releases/releases#list-releases
      # The guarded verify command performs reads only and never promotes a draft.
      contents: write
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck full-main security and complete assets; preserve draft for independent acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.prepare.outputs.sha }}
          EXPECTED_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python -m scripts.release_gate verify
